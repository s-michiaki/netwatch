name: Release

# GitHub 上で Release を公開すると、Windows 向けにビルドしてその Release に zip を添付する。
# 手動実行（workflow_dispatch）では、ビルド結果を Actions の成果物（Artifacts）として保存する。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: ${{ github.event.release.tag_name || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (self-contained win-x64)
        run: dotnet publish NetWatch.csproj -c Release -r win-x64 --self-contained true -o publish/NetWatch

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/NetWatch -DestinationPath "NetWatch-$env:VERSION-win-x64.zip"

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: NetWatch-${{ env.VERSION }}-win-x64.zip

      - name: Upload artifact (manual run)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: NetWatch-${{ env.VERSION }}-win-x64
          path: publish/NetWatch
