name: Release

# GitHub 上で Release を公開すると、Windows 向けにビルド・動作確認して、その Release に zip を添付する。
# 手動実行（workflow_dispatch）では、zip を Actions の成果物（Artifacts）として保存する。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: ${{ github.event.release.tag_name || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 設定は NetWatch.csproj（単一ファイル・win-x64・ランタイム同梱）
      - name: Publish (single file)
        run: dotnet publish NetWatch.csproj -c Release -o publish

      # 単一ファイル版を実際に起動して、接続一覧・ETW・GeoIP・画面が動くかを確かめる（ランナーは管理者権限）
      - name: Self test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "publish\NetWatch.exe" -ArgumentList "--selftest", "--out", "$pwd\selftest.log" -Wait -PassThru
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { Write-Error "selftest failed (exit $($p.ExitCode))"; exit 1 }

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force NetWatch | Out-Null
          Copy-Item publish\NetWatch.exe, publish\THIRD-PARTY-NOTICES.txt NetWatch\
          Compress-Archive -Path NetWatch -DestinationPath "NetWatch-$env:VERSION-win-x64.zip"

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: NetWatch-${{ env.VERSION }}-win-x64.zip

      - name: Upload artifact (manual run)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: NetWatch-${{ env.VERSION }}-win-x64
          path: NetWatch-${{ env.VERSION }}-win-x64.zip
