name: Release

# v で始まるタグ（例: v0.5.0）を push すると、Windows 向けにビルドして Release に zip を添付する
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (self-contained win-x64)
        run: dotnet publish NetWatch.csproj -c Release -r win-x64 --self-contained true -o publish/NetWatch

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/NetWatch -DestinationPath "NetWatch-${{ github.ref_name }}-win-x64.zip"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NetWatch-${{ github.ref_name }}-win-x64.zip
